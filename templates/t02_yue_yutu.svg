<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 55 200"
     width="55mm" height="200mm"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- =========================================================
       中秋「月」字·玉兔竹影款（严格对标 Etsy 畅销书签美学）
       设计原则：
       · 78% 留白 → 木纹当底
       · 雕刻 3 层：浅（竹影叶脉）/中（玉兔+月字外框）/深（月字主体+桂花瓣阴影）
       · 顶部大圆「月窗」半透空 → 流苏挂孔藏在里面，构图完美
       · 透空只有 1 处（大月窗），其他全部雕刻，保证木头完整不碎
       ========================================================= -->

  <defs>
    <!-- 空 -->
  </defs>

  <!-- 【CUT 切割组 · 0.08mm 红线】—— 只有这些会切穿 -->
  <!-- ① 书签外轮廓 55×200 圆角 -->
  <path d="M 5 10
           C 5 7.239, 7.239 5, 10 5
           L 45 5
           C 47.761 5, 50 7.239, 50 10
           L 50 190
           C 50 192.761, 47.761 195, 45 195
           L 10 195
           C 7.239 195, 5 192.761, 5 190
           Z"
        fill="none" stroke="#FF0000" stroke-width="0.08" stroke-linejoin="round"/>

  <!-- ② 顶部「月窗」透空 φ22mm（月亮形状 + 挂孔合二为一，构图统一） -->
  <!-- 注意：月窗只做「大半圆透空」，底部留 3mm 木头连接不切穿 → 避免碎，同时挂孔位藏在里面 -->
  <path d="M 27.5 12
           m -11 0
           a 11 11 0 1 0 22 0
           a 11 11 0 1 0 -22 0
           Z"
        fill="none" stroke="#FF0000" stroke-width="0.08"/>
  <!-- 挂孔 φ3.5mm 放在月窗「中心上 3mm」，不用额外挖孔 -->
  <circle cx="27.5" cy="15" r="1.75"
          fill="none" stroke="#FF0000" stroke-width="0.08"/>

  <!-- ③ 右下角 1 处小桂花透空（5mm φ，平衡视觉） -->
  <!-- 就 1 处！保证木纹完整，不会碎 -->
  <circle cx="45" cy="184" r="1.8"
          fill="none" stroke="#FF0000" stroke-width="0.08"/>


  <!-- =========================================================
       【ENGRAVE 雕刻组 · 3 层灰度】
       功率建议：浅 20%（竹影） · 中 45%（玉兔、桂花瓣） · 深 75%（月字）
       ========================================================= -->

  <!-- ── 第三层：浅雕 20% ── 右侧竹叶 + 叶脉（若隐若现，木纹之上一层薄纱感） -->
  <g fill="none" stroke="#000000" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- 主竹杆：从右上（月窗右下）斜插下到右下，分 3 节 -->
    <path d="M 38 32
             L 44 76
             L 40 120
             L 46 166"/>
    <!-- 竹节 3 处：短横线 -->
    <path d="M 37.2 44  L 39.2 43"/>
    <path d="M 43.3 88  L 45.3 87"/>
    <path d="M 39.2 132 L 41.2 131"/>

    <!-- 竹 1：左上小叶丛，6 片 -->
    <path d="M 39.5 40
             L 34 38
             L 37 42
             L 33 44
             L 37 45
             L 34 49
             L 38 48
             L 35 52"/>
    <!-- 竹 2：右中叶丛，5 片 -->
    <path d="M 42 90
             L 49 88
             L 46 92
             L 50 94
             L 46 95"/>
    <!-- 竹 3：下大叶丛，8 片（最长） -->
    <path d="M 43 140
             L 50 137
             L 47 141
             L 51 144
             L 47 146
             L 50 149
             L 45 150
             L 48 153
             L 43 154"/>
  </g>

  <!-- ── 第二层：中雕 45% ── 玉兔 + 云纹 + 桂花瓣（中等深度，光影层次） -->

  <!-- 云纹 2 朵：小月窗左上和右下（祥云绕月，古风感） -->
  <g fill="none" stroke="#000000" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 14 16
             C 12 14, 10 16, 12 18
             C 9 18, 9 22, 12 22
             C 14 24, 18 23, 17 20
             C 20 21, 20 17, 17 16 Z"/>
    <path d="M 37 25
             C 36 23, 33 24, 34 27
             C 31 27, 31 31, 34 31
             C 36 33, 40 32, 39 29
             C 42 30, 42 26, 39 26 Z"/>
  </g>

  <!-- 玉兔：位于书签下半段 110-145mm 居中左侧，卧姿，望月（抬头） -->
  <!-- 风格：Etsy 款的线条风，不是卡通 → 优雅 + 毛茸茸耳朵 + 抱月饼小爪 -->
  <g fill="#000000" stroke="none">
    <!-- 玉兔身体：椭圆卧姿 -->
    <path d="M 13 141
             C 11 139, 11 135, 13 133
             C 13 129, 17 127, 20 127
             C 22 125, 26 125, 28 127
             C 31 128, 33 131, 32 134
             C 35 135, 36 139, 34 141
             C 35 144, 32 146, 30 145
             L 16 146
             C 13 146, 11 144, 13 141 Z"/>
    <!-- 大耳朵 1（竖）：左 -->
    <path d="M 16 128
             C 15 123, 17 118, 20 118
             C 22 118, 22 122, 21 126
             C 20 129, 17 130, 16 128 Z"/>
    <!-- 大耳朵 2（微倾）：右 -->
    <path d="M 21 126
             C 20 121, 22 117, 25 117
             C 27 117, 27 121, 26 125
             C 25 128, 22 129, 21 126 Z"/>
    <!-- 眼睛：小黑圆（望月）→ 2 点 -->
    <circle cx="28.5" cy="133.5" r="0.55"/>
    <circle cx="26.0" cy="133.8" r="0.45"/>
    <!-- 小鼻子 -->
    <path d="M 31.6 135.2 c -0.3 0, -0.6 0.3, -0.2 0.5 c 0.4 0.2, 0.5 -0.2, 0.2 -0.5 Z"/>
    <!-- 胡须（3 条细线左，3 条右） -->
    <g stroke="#000000" stroke-width="0.15" fill="none" stroke-linecap="round">
      <path d="M 33 136 L 37 135"/>
      <path d="M 33 137 L 37 137"/>
      <path d="M 33 138 L 37 139"/>
      <path d="M 30 136 L 26 135.5"/>
      <path d="M 30 137 L 26 137.5"/>
    </g>
    <!-- 小爪（抱月饼） -->
    <path d="M 25 141
             C 24 140, 24 138, 26 138
             C 28 138, 28 140, 27 141
             Z"/>
    <!-- 小尾巴（圆绒球） -->
    <circle cx="13.5" cy="142" r="1.1"/>
  </g>

  <!-- 月饼：玉兔怀里抱着的小月饼 φ9mm，上刻小「月」字（细节彩蛋） -->
  <g fill="none" stroke="#000000" stroke-width="0.4" stroke-linejoin="round">
    <!-- 月饼外圆（压花纹理，8 个扇形花瓣） -->
    <circle cx="27" cy="142" r="4.3"/>
    <circle cx="27" cy="142" r="3.5" stroke-dasharray="0.2 0.3"/>
    <!-- 月饼上月字（简化小篆） -->
    <path d="M 25.3 141.3 l 3.4 0 M 25.3 142.0 l 3.4 0 M 25.3 142.7 l 3.4 0
             M 25.6 140.5 l 0 2.8 l 2.8 0 l 0 -2.8 Z"
          stroke-width="0.28"/>
  </g>

  <!-- 桂花 3 朵（右上、左下、底部落款边）：4 瓣，雕刻中功率阴影 -->
  <g fill="#000000" stroke="none">
    <!-- 上：月窗下沿 -->
    <path d="M 38.5 37 C 39 35.6, 40.5 35.6, 41 37 C 42.4 37.5, 42.4 39, 41 39.5
             C 40.5 40.9, 39 40.9, 38.5 39.5 C 37.1 39, 37.1 37.5, 38.5 37 Z
             M 39.75 38.25 a 0.8 0.8 0 1 0 1.6 0 a 0.8 0.8 0 1 0 -1.6 0"/>
    <!-- 中：玉兔右耳尖边 -->
    <path d="M 29 114.5 C 29.5 113.1, 31 113.1, 31.5 114.5 C 32.9 115, 32.9 116.5, 31.5 117
             C 31 118.4, 29.5 118.4, 29 117 C 27.6 116.5, 27.6 115, 29 114.5 Z"/>
    <!-- 下：玉兔左下方（和底部透空桂花呼应） -->
    <path d="M 10 174 C 10.5 172.6, 12 172.6, 12.5 174 C 13.9 174.5, 13.9 176, 12.5 176.5
             C 12 177.9, 10.5 177.9, 10 176.5 C 8.6 176, 8.6 174.5, 10 174 Z
             M 11.25 175.25 a 0.7 0.7 0 1 0 1.4 0 a 0.7 0.7 0 1 0 -1.4 0"/>
  </g>

  <!-- 3 颗小星散点：月窗周围，大小不一（细节点缀，不空） -->
  <g fill="#000000" stroke="none">
    <!-- 星 1：左上云纹间 -->
    <path d="M 8 20 l 0.8 -0.1 l 0.2 -0.8 l 0.2 0.8 l 0.8 0.1 l -0.7 0.5 l 0.2 0.8 l -0.7 -0.4 l -0.7 0.4 l 0.2 -0.8 Z"/>
    <!-- 星 2：右上竹叶顶 -->
    <path d="M 31 7 l 0.5 -0.1 l 0.1 -0.5 l 0.1 0.5 l 0.5 0.1 l -0.4 0.3 l 0.1 0.5 l -0.4 -0.3 l -0.4 0.3 l 0.1 -0.5 Z" transform="scale(0.85) translate(6 2)"/>
    <!-- 星 3：大月窗左下 -->
    <path d="M 18 25 l 0.7 -0.1 l 0.2 -0.7 l 0.2 0.7 l 0.7 0.1 l -0.6 0.4 l 0.2 0.7 l -0.6 -0.3 l -0.6 0.3 l 0.2 -0.7 Z" transform="scale(0.75) translate(7 9)"/>
  </g>


  <!-- ── 第一层：深雕 75% ── 中央「月」字（小篆风，粗而有笔势，位于书签中段 50-95mm） -->
  <!-- 占据 18×28mm，居中，篆书圆润，符合中秋氛围 -->
  <g fill="#000000" stroke="none">
    <!-- 小篆「月」：外框 2 竖 + 中间 3 横连右不连左（经典篆法） -->
    <!-- 左竖（略有弧度，像月牙） -->
    <path d="M 19.5 51
             C 18.0 55, 17.8 64, 19.5 75
             C 18.0 80, 18.0 88, 19.5 94
             L 21.8 94
             C 21.5 88, 20.5 80, 21.8 74
             C 20.7 64, 20.5 56, 21.8 51 Z"/>
    <!-- 右竖（略直，外侧） -->
    <path d="M 33.5 51
             C 35.0 55, 35.2 64, 33.5 75
             C 35.0 80, 35.0 88, 33.5 94
             L 31.2 94
             C 31.5 88, 32.5 80, 31.2 74
             C 32.3 64, 32.5 56, 31.2 51 Z"/>
    <!-- 上横（连接两竖顶部，圆弧上拱） -->
    <path d="M 21.8 51
             C 25 49, 29 49, 31.2 51
             C 31.5 52.5, 31.3 53.8, 29.5 54
             C 27.5 54.3, 25.5 54.3, 23.5 54
             C 22.0 53.8, 21.6 52.5, 21.8 51 Z"/>
    <!-- 中三横（连右不连左，篆法标准，略带弧度不僵直） -->
    <path d="M 31.2 63
             C 29 63.5, 25.5 63.5, 23 63
             L 23 65
             C 25.8 65.5, 29 65.5, 31.5 65 Z"/>
    <path d="M 31.2 73
             C 29 73.5, 25.5 73.5, 23 73
             L 23 75
             C 25.8 75.5, 29 75.5, 31.5 75 Z"/>
    <path d="M 31.2 83
             C 29 83.5, 25.5 83.5, 23 83
             L 23 85
             C 25.8 85.5, 29 85.5, 31.5 85 Z"/>
    <!-- 下横（连接底部，圆弧下拱） -->
    <path d="M 21.8 94
             C 25 96, 29 96, 31.2 94
             C 31.5 92.5, 31.3 91.2, 29.5 91
             C 27.5 90.7, 25.5 90.7, 23.5 91
             C 22.0 91.2, 21.6 92.5, 21.8 94 Z"/>
  </g>

  <!-- 底部落款：小篆「中秋」+「岁在丙午」（极小，浅+中雕刻交错，和古玉牌的边款一样） -->
  <g stroke="#000000" stroke-width="0.25" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 中（篆） -->
    <path d="M 22.5 172 l 0 4 M 22.5 174 l -1.6 0 M 22.5 174 l 1.6 0
             M 21.2 171.5 l 0 5 l 2.6 0 l 0 -5 Z" stroke-width="0.28"/>
    <!-- 秋（篆，简化为禾+火合体） -->
    <path d="M 27.2 172 l 0 5 M 26.2 173 l 2 0 M 26.0 175 l 2.4 0
             M 26.4 177 l 0 -3 l 2.4 0 l 0 3 Z" stroke-width="0.28"/>
    <!-- 小印：红色印章位（用黑色雕刻外框，用户可自行盖红印） -->
    <rect x="31.5" y="172" width="3.5" height="3.5" rx="0.25" ry="0.25" stroke-width="0.35"/>
    <path d="M 32.2 173.8 l 1.1 -0.2 l 0.1 -1.1 l 0.1 1.1 l 1.1 -0.2 l -1 0.7 l 0.1 1.1 l -1 -0.6 l -1 0.6 l 0.1 -1.1 Z" stroke-width="0.2"/>
  </g>

  <!-- 左侧竖排小字：「清辉玉臂 · 寒夜秋思」（杜甫月夜忆舍弟诗意，小楷浅刻） -->
  <g stroke="#000000" stroke-width="0.22" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 9.5 55  l 0 3.2  M 8.8 56.2 l 1.4 0"/>           <!-- 清（简化：3点+青） -->
    <path d="M 9.5 60.2 l 0 3.0  M 8.8 61.5 l 1.4 0"/>          <!-- 辉 -->
    <path d="M 9.5 65.5 l 0 3.0  M 8.6 66.8 l 1.9 0"/>          <!-- 玉 -->
    <path d="M 9.5 70.8 l 0 2.8  M 8.8 72.0 l 1.4 0"/>          <!-- 臂 -->
    <path d="M 9.5 81.5 l 0 3.0  M 8.8 82.7 l 1.4 0"/>          <!-- 寒 -->
    <path d="M 9.5 86.8 l 0 2.8  M 8.6 88.0 l 1.9 0"/>          <!-- 夜 -->
    <path d="M 9.5 92.1 l 0 3.0  M 8.8 93.3 l 1.4 0"/>          <!-- 秋 -->
    <path d="M 9.5 97.4 l 0 3.0  M 8.8 98.6 l 1.4 0"/>          <!-- 思 -->
  </g>

</svg>
