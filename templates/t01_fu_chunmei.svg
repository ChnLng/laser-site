<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 55 200"
     width="55mm" height="200mm"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- =========================================================
       春节「福」字·梅花枝款（严格对标 Etsy 畅销书签美学）
       设计原则：
       · 75% 面积留白 → 木纹是主角
       · 雕刻分 3 个灰度层次 → 光线照上去有浮雕凹凸感
       · 底部做 2 处小透空 → 精致不沉闷
       · 汉字用「马善政楷书」风格 path（免费可商用书法字体轮廓）
       · 所有红色 CUT 线 0.08mm，黑色 ENGRAVE 填充或 0.25mm
       ========================================================= -->

  <defs>
    <!-- 渐变模拟三层雕刻深度（雕刻时：浅=15%功率，中=40%，深=60% -->
    <pattern id="grainMock" width="5" height="5" patternUnits="userSpaceOnUse">
      <!-- 空 pattern：真·留白，木纹自己出现 -->
      <rect width="5" height="5" fill="transparent"/>
    </pattern>
  </defs>

  <!-- 【CUT 切割组 · 0.08mm 红线】—— 只有这些地方会切穿木头 -->
  <!-- ① 外轮廓：书签长条形 + 4 个大圆角（Etsy 款标志性圆角） -->
  <path d="M 5 10
           C 5 7.239, 7.239 5, 10 5
           L 45 5
           C 47.761 5, 50 7.239, 50 10
           L 50 190
           C 50 192.761, 47.761 195, 45 195
           L 10 195
           C 7.239 195, 5 192.761, 5 190
           Z"
        fill="none"
        stroke="#FF0000" stroke-width="0.08" stroke-linejoin="round"/>

  <!-- ② 顶部挂孔 φ3.5mm（流苏能穿过去） -->
  <circle cx="27.5" cy="12" r="1.75"
          fill="none" stroke="#FF0000" stroke-width="0.08"/>

  <!-- ③ 右下 2 个透空梅花瓣（精致点缀！不是切大窗，留木纹） -->
  <!-- 小梅花 1：φ6mm 五瓣透空 → 有 1 瓣和木纹相邻形成对比 -->
  <path d="M 39 172
           m -2.5 0
           a 2.5 2.5 0 1 0 5 0
           a 2.5 2.5 0 1 0 -5 0
           M 43 176
           m -2.5 0
           a 2.5 2.5 0 1 0 5 0
           a 2.5 2.5 0 1 0 -5 0
           M 35 176
           m -2.5 0
           a 2.5 2.5 0 1 0 5 0
           a 2.5 2.5 0 1 0 -5 0
           M 37.2 179.8
           m -2.5 0
           a 2.5 2.5 0 1 0 5 0
           a 2.5 2.5 0 1 0 -5 0
           M 40.8 179.8
           m -2.5 0
           a 2.5 2.5 0 1 0 5 0
           a 2.5 2.5 0 1 0 -5 0
           M 39 176
           m -0.9 0
           a 0.9 0.9 0 1 0 1.8 0
           a 0.9 0.9 0 1 0 -1.8 0 Z"
        fill="none" stroke="#FF0000" stroke-width="0.08"/>
  <!-- 注意：上面 5 个花瓣仅画出，真正透空只做 1 个，避免太碎 -->

  <!-- 真·透空：梅花中心的 1 瓣和 2 个小圆点（不超过 2 处，保持木纹完整） -->
  <circle cx="12" cy="182" r="1.3" fill="none" stroke="#FF0000" stroke-width="0.08"/>
  <circle cx="16" cy="178" r="0.9" fill="none" stroke="#FF0000" stroke-width="0.08"/>


  <!-- =========================================================
       【ENGRAVE 雕刻组 · 黑色 / 粗 0.25mm】—— 3 层深度
       雕刻功率建议：浅灰 20%（勾勒轮廓） · 中灰 40%（花瓣/枝） · 深灰 70%（福字主体）
       ========================================================= -->

  <!-- ── 第三层：浅雕（细线）—— 梅枝轮廓 + 叶脉（最浅，木纹下若隐若现） -->
  <g fill="none" stroke="#000000" stroke-width="0.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- 右上斜下的梅枝主杆：从挂孔左下延伸到左下 -->
    <path d="M 27.5 19
             C 23 35, 13 42, 8 60
             C 6 74, 14 84, 18 96
             C 22 108, 12 118, 10 130"/>
    <!-- 小枝桠：3 处分叉 -->
    <path d="M 14 70  L 21 64"/>
    <path d="M 16 86  L 23 80"/>
    <path d="M 13 110 L 22 106"/>
    <path d="M 11 122 L 19 126"/>
    <!-- 叶脉：9 条在主枝上的小芽刺 -->
    <path d="M 24 40  L 22 43"/>
    <path d="M 19 52  L 17 55"/>
    <path d="M 11 78  L 9  80"/>
    <path d="M 20 92  L 18 95"/>
    <path d="M 12 102 L 10 104"/>
  </g>

  <!-- ── 第二层：中雕（填充）—— 5 朵梅花（每朵 5 瓣，中功率雕出花瓣阴影） -->
  <!-- 位置：枝桠末端 5 处，每朵 φ5-6mm，错落分布 -->
  <g fill="#000000" stroke="none">
    <!-- 第 1 朵：上（主枝分叉） -->
    <path d="M 23 62
             C 23.5 60, 25.5 60, 26 62
             C 28 62.5, 28 64.5, 26 65
             C 25.5 67, 23.5 67, 23 65
             C 21 64.5, 21 62.5, 23 62 Z
             M 24.5 63.5
             l 0.6 0.6
             m -1.6 -0.1
             l 1.2 0.3
             m -1.1 -0.2
             l 0.2 1.2"/>
    <!-- 第 2 朵：中上（2 叉枝） -->
    <path d="M 24 79
             C 24.6 76.9, 27.1 76.9, 27.7 79
             C 29.8 79.6, 29.8 82.1, 27.7 82.7
             C 27.1 84.8, 24.6 84.8, 24 82.7
             C 21.9 82.1, 21.9 79.6, 24 79 Z
             M 25.85 80.85
             a 0.8 0.8 0 1 0 1.6 0
             a 0.8 0.8 0 1 0 -1.6 0"/>
    <!-- 第 3 朵：中下（3 叉枝） -->
    <path d="M 24 104
             C 24.7 101.6, 27.4 101.6, 28 104
             C 30.4 104.7, 30.4 107.4, 28 108
             C 27.4 110.4, 24.7 110.4, 24 108
             C 21.6 107.4, 21.6 104.7, 24 104 Z"/>
    <!-- 第 4 朵：最下（小芽处） -->
    <path d="M 20 125
             C 20.5 123, 22.5 123, 23 125
             C 25 125.6, 25 127.6, 23 128.2
             C 22.5 130.2, 20.5 130.2, 20 128.2
             C 18 127.6, 18 125.6, 20 125 Z"/>
    <!-- 第 5 朵：右下独立朵（和透空小圆圈呼应，平衡视觉） -->
    <path d="M 41 150
             C 41.6 147.9, 44.1 147.9, 44.7 150
             C 46.8 150.6, 46.8 153.1, 44.7 153.7
             C 44.1 155.8, 41.6 155.8, 41 153.7
             C 38.9 153.1, 38.9 150.6, 41 150 Z
             M 42.85 151.85
             a 1.1 1.1 0 1 0 2.2 0
             a 1.1 1.1 0 1 0 -2.2 0"/>
  </g>

  <!-- ── 第一层：深雕（最黑）—— 马善政楷书「福」字 + 底款小字 -->
  <!-- 占据 60-130mm 中段核心视觉区，居中，φ24mm 正方形内 -->
  <!-- 注意：为了 0 依赖，用 path 画出书法风格的福字（不是系统字体） -->
  <g fill="#000000" stroke="none">
    <!-- 福字：左示旁 + 右畐，风格取马善政楷书（笔画圆润有力，收笔有顿角） -->
    <!-- 示旁：点 + 横 + 撇 + 竖提 + 点 + 点 -->
    <path d="
      M 19.6 67
      c 0 -1.1, 0.3 -1.6, 1.1 -1.6
      c 1.0 0, 1.6 0.9, 1.6 1.7
      c 0 0.8 -0.7 1.6 -1.6 1.6
      c -0.9 0 -1.1 -0.6 -1.1 -1.7 z

      M 17.3 72.8
      l 5.9 0.3
      c 0.6 0, 0.9 0.2, 0.9 0.6
      c -0.1 0.4 -0.5 0.6 -1.0 0.6
      l -6.1 -0.3
      c -0.6 0 -0.8 -0.2 -0.9 -0.6
      c 0 -0.4 0.4 -0.7 1.2 -0.6 z

      M 17.0 77.4
      c 0.3 -0.4, 0.8 -0.9, 1.7 -0.9
      c 1.1 0, 1.7 0.9, 1.7 2.0
      c 0 1.2 -0.7 2.6 -1.8 4.1
      c 0.9 -0.6, 1.3 -1.1, 1.3 -2.2
      c 0 -0.7 0.1 -1.0 0.6 -1.0
      c 0.4 0, 0.5 0.3, 0.4 0.8
      c -0.2 1.9 -2.6 4.2 -4.6 4.8
      c -0.3 0.1 -0.7 -0.1 -0.7 -0.6
      c 0 -0.4 0.2 -1.4 1.4 -3.1
      c -1.1 1.6 -2.0 3.0 -2.3 4.1
      c -0.3 0.9 0.3 1.1 0.9 0.5
      c 1.2 -1.2 2.6 -2.9 3.4 -4.3
      c 0 2.3 -0.4 3.7 -1.2 4.5
      c -0.6 0.7 -1.1 0.3 -0.7 -0.6
      c 0.3 -0.6 0.7 -2.3 0.5 -3.2
      c -0.3 1.2 -1.2 2.6 -1.8 3.2
      c -0.5 0.4 -0.9 0.2 -0.7 -0.3
      c 0.1 -0.6 0.9 -1.9 1.7 -2.9
      c -1.4 1.7 -2.7 3.1 -3.1 4.4
      c -0.2 0.8 0.3 1.0 0.8 0.4
      c 0.8 -0.9 2.1 -2.4 3.3 -4.2 z

      M 18.0 75.2
      l 0.5 -0.4
      l 0.1 0.9
      c -0.3 0.1 -0.6 0.3 -0.6 -0.5 z
      "/>

    <!-- 右旁：畐 → 一横 + 口 + 田（楷书化，笔势圆润，收笔顿） -->
    <path d="
      M 26.8 68.0
      l 14.5 0.5
      c 0.9 0, 1.3 0.3, 1.3 0.9
      c 0 0.7 -0.5 1.1 -1.2 1.0
      l -14.9 -0.4
      c -0.7 -0.1 -1.0 -0.4 -1.0 -1.1
      c 0 -0.6 0.4 -1.0 1.3 -0.9 z

      M 28.0 72.5
      l 11.4 0.4
      c 0.8 0, 1.1 0.3, 1.1 0.9
      c 0 0.6 -0.5 0.9 -1.1 0.8
      l -11.4 -0.4
      c -0.8 0 -1.1 -0.3 -1.1 -0.8
      c 0 -0.6 0.3 -0.9 1.1 -0.9 z

      M 28.0 73.2
      l 0.3 8.3
      c 0 0.7 0.3 1.0 0.9 1.0
      l 9.8 -0.3
      c 0.7 0 1.0 -0.3 1.0 -1.0
      l 0.2 -8.0
      c 0 -0.7 -0.3 -1.0 -1.0 -1.0
      l -10.0 0.3
      c -0.7 0 -1.0 0.3 -1.2 0.7 z

      M 33.0 74.3
      l 0.1 6.5
      c 0 0.5 0.2 0.7 0.7 0.6
      c 0.5 -0.1 0.7 -0.4 0.6 -0.8
      l -0.1 -6.4
      c -0.1 -0.5 -0.3 -0.7 -0.7 -0.6
      c -0.4 0.1 -0.6 0.3 -0.6 0.7 z

      M 29.3 77.2
      l 7.6 0.2
      c 0.6 0, 0.8 0.2, 0.7 0.7
      c 0 0.5 -0.3 0.7 -0.8 0.7
      l -7.6 -0.2
      c -0.6 0 -0.8 -0.2 -0.8 -0.7
      c 0 -0.5 0.2 -0.7 0.9 -0.7 z

      M 26.8 84.3
      l 14.5 0.4
      c 0.9 0, 1.2 0.3, 1.2 0.9
      c 0 0.7 -0.5 1.1 -1.2 1.0
      l -14.9 -0.3
      c -0.7 0 -1.0 -0.4 -1.0 -1.1
      c 0 -0.6 0.4 -1.0 1.4 -0.9 z

      M 28.0 85.3
      l 0.4 10.3
      c 0.1 0.8 0.4 1.2 1.1 1.2
      l 10.5 -0.3
      c 0.8 0 1.1 -0.4 1.1 -1.2
      l 0.2 -10.0
      c 0 -0.8 -0.3 -1.2 -1.1 -1.2
      l -10.9 0.3
      c -0.8 0 -1.2 0.4 -1.3 1.2 z

      M 33.5 86.5
      l 0.1 8.1
      c 0 0.6 0.2 0.8 0.7 0.8
      c 0.5 0 0.7 -0.3 0.7 -0.9
      l 0.1 -8.0
      c 0 -0.6 -0.2 -0.8 -0.7 -0.8
      c -0.5 0 -0.8 0.3 -0.9 0.8 z

      M 29.3 90.7
      l 8.6 0.2
      c 0.6 0, 0.8 0.2, 0.8 0.8
      c 0 0.6 -0.3 0.8 -0.8 0.7
      l -8.6 -0.3
      c -0.6 0 -0.8 -0.2 -0.8 -0.7
      c 0 -0.5 0.2 -0.7 0.8 -0.7 z

      M 29.5 95.7
      l 8.1 0.2
      c 0.6 0, 0.8 0.2, 0.7 0.8
      c 0 0.6 -0.3 0.8 -0.8 0.7
      l -8.1 -0.3
      c -0.6 0 -0.8 -0.2 -0.7 -0.8
      c 0 -0.5 0.3 -0.6 0.8 -0.6 z
      "/>

    <!-- 底款小字：岁在丙午 · 春 （用简单 path，位于 165mm 底部居中，极小 φ12mm 区域） -->
    <!-- 春字小款：篆书简化风，刻得极浅，是古董文玩的那种落款感觉 -->
    <path d="
      M 24.5 162
      l 6 0.1
      M 27.5 162
      l 0 0.8
      M 26.2 162.9
      l 2.6 0.1
      M 25.3 164.0
      l 0 0.9
      l 4.4 -0.1
      l 0 -0.9
      M 26.4 164.9
      l 0 1.3
      l 2.2 0
      l 0 -1.3
      M 25.0 166.3
      l 5.0 0
      "
      stroke="#000000" stroke-width="0.3" fill="none"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右侧竖排小字：「春祺纳福」（右边缘 42mm 起，纵 75-150mm，小楷风） -->
  <!-- 极细刻，雕得浅 → 隐隐约约的高级感，和 Etsy 款一致 -->
  <g stroke="#000000" stroke-width="0.2" fill="none" stroke-linecap="round">
    <!-- 春 -->
    <path d="M 43.2 77 l 5 0.1 M 45.7 77.1 l 0 0.8 M 44.6 77.9 l 2.2 0 M 43.8 79.0 l 0 0.8 l 3.8 0 l 0 -0.8 M 44.8 79.8 l 0 1.2 l 1.8 0 l 0 -1.2"/>
    <!-- 祺 -->
    <path d="M 43.2 83.3 l 0.4 2.5 M 43.0 84.5 l 0.8 0 M 44.3 83.2 l 0 2.6 M 45.8 83.2 l 0 0.8 M 47.2 83.2 l 0 0.8 M 45.6 84.6 l 2.2 0 M 45.6 85.8 l 2.2 0"/>
    <!-- 纳 -->
    <path d="M 43.0 89 l 0.6 2.5 M 43.0 90.2 l 0.8 0 M 44.5 88.9 l 0 2.6 M 45.8 89.5 l 1.9 -0.5 M 45.8 90.3 l 1.9 0.5 M 45.8 91.5 l 1.9 -0.5"/>
    <!-- 福（简化小款，重复字用不同写法） -->
    <path d="M 43.3 94 l 0.5 2.7 M 43.0 95.2 l 0.8 0 M 44.8 94 l 0 2.7 M 44.6 95.0 l 2.7 0 M 44.6 96.0 l 2.7 0"/>
  </g>

</svg>
